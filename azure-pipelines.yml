trigger:
  branches:
    include:
      - main

parameters:
- name: environment
  displayName: Environment
  type: string
  default: tst
  values:
    - tst
    - uat
    - prd

variables:
  imageName: 'survey-themes-derzhstat'
  acrName: acrqhpipelines${{ parameters.environment }}.azurecr.io
  acrServiceConnection: acrqhpipelines${{ parameters.environment }}
  dockerfilePath: 'Dockerfile'

stages:
- stage: Build
  displayName: Build and Push (${{ parameters.environment }})
  jobs:
  - job: Build
    pool:
      vmImage: 'SSSU-buildagent'

    steps:
    - checkout: self

    - script: |
        SHORT_SHA=$(echo $(Build.SourceVersion) | cut -c1-7)
        echo "##vso[task.setvariable variable=SHORT_SHA]$SHORT_SHA"
      displayName: 'Generate short commit hash'

    # Set Build.BuildNumber to the short commit hash for better traceability
    - script: |
        echo "##vso[build.updatebuildnumber]${{ parameters.environment }}-$(SHORT_SHA)"
      displayName: 'Update Build Number'

    # Set build tag to environment for release pipelines
    - script: |
        echo "##vso[build.addbuildtag]${{ parameters.environment }}"
      displayName: 'Add build tag'
    
    # Write version info to a file for artifact publishing into artifact staging directory
    - script: |
        echo "Version: ${{ parameters.environment }}-$(SHORT_SHA)" > $(Build.ArtifactStagingDirectory)/version.txt
      displayName: 'Write version info'

    - task: Docker@2
      displayName: 'Build and Push'
      inputs:
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageName)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          ${{ parameters.environment }}-$(SHORT_SHA)
          ${{ parameters.environment }}-latest

    - task: PublishBuildArtifacts@1
      displayName: 'Publish version artifact'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/version.txt'
        artifactName: 'image-version'